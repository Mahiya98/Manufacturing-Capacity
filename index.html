<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Machine Capacity Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
  h1 { text-align: center; color: #333; }
  #filters { margin-bottom: 20px; text-align: center; }
  select { margin: 0 10px; padding: 5px; }
  #dataTable {
    width: 95%;
    margin: 20px auto;
    border-collapse: collapse;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #f4f4f4;
  }
  #noDataMessage {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
    color: #a00;
  }
</style>
</head>
<body>

<h1>Machine Capacity Dashboard</h1>

<div id="filters">
  <label>Cluster:
    <select id="clusterFilter" onchange="updateSBUFilter()"><option value="">All</option></select>
  </label>
  <label>SBU:
    <select id="sbuFilter" onchange="updateMachineFilter()" disabled><option value="">All</option></select>
  </label>
  <label>Machine:
    <select id="machineFilter" onchange="applyFilters()" disabled><option value="">All</option></select>
  </label>
</div>

<table id="dataTable">
  <thead>
    <tr>
      <th>Cluster</th>
      <th>SBU</th>
      <th>Machine</th>
      <th>Design Capacity</th>
      <th>Workable Capacity</th>
      <th>Actual Capacity</th>
      <th>UOM</th>
    </tr>
  </thead>
  <tbody>
    <!-- Data rows will be dynamically inserted here -->
  </tbody>
</table>

<div id="noDataMessage" style="display:none;">No data for selected filters.</div>

<script>
  const SHEET_ID = '1UlWyBvY6z4cca-jNhz0fu1hl-Y56tkD2uSw4jvQr1Lo';
  const SHEET_GID = '763920307';
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

  let allData = [];
  let filteredData = [];

  function csvToArray(str, delimiter = ',') {
    const headers = str.slice(0, str.indexOf('\n')).split(delimiter).map(h => h.trim());
    const rows = str.slice(str.indexOf('\n') + 1).split('\n').filter(r => r.trim() !== '');
    return rows.map(row => {
      const values = row.split(delimiter);
      return headers.reduce((obj, header, i) => {
        obj[header] = values[i] ? values[i].trim() : '';
        return obj;
      }, {});
    });
  }

  function populateClusterFilter(data) {
    const clusterSet = new Set();
    data.forEach(row => {
      if (row['Cluster']) clusterSet.add(row['Cluster']);
    });
    fillSelect('clusterFilter', clusterSet);
  }

  function updateSBUFilter() {
    const cluster = document.getElementById('clusterFilter').value;
    const sbuSet = new Set();

    allData.forEach(row => {
      if (row['Cluster'] === cluster) {
        sbuSet.add(row['SBU']);
      }
    });

    fillSelect('sbuFilter', sbuSet);
    document.getElementById('sbuFilter').disabled = !sbuSet.size;
    document.getElementById('machineFilter').disabled = true;
    document.getElementById('machineFilter').innerHTML = '<option value="">All</option>';
    applyFilters();
  }

  function updateMachineFilter() {
    const cluster = document.getElementById('clusterFilter').value;
    const sbu = document.getElementById('sbuFilter').value;
    const machineSet = new Set();

    allData.forEach(row => {
      if (row['Cluster'] === cluster && row['SBU'] === sbu) {
        machineSet.add(row['Machine']);
      }
    });

    fillSelect('machineFilter', machineSet);
    document.getElementById('machineFilter').disabled = !machineSet.size;
    applyFilters();
  }

  function fillSelect(id, valuesSet) {
    const select = document.getElementById(id);
    select.innerHTML = '<option value="">All</option>';
    Array.from(valuesSet).sort().forEach(val => {
      const option = document.createElement('option');
      option.value = val;
      option.textContent = val;
      select.appendChild(option);
    });
  }

  function applyFilters() {
    const cluster = document.getElementById('clusterFilter').value;
    const sbu = document.getElementById('sbuFilter').value;
    const machine = document.getElementById('machineFilter').value;

    filteredData = allData.filter(row => {
      return (!cluster || row['Cluster'] === cluster) &&
             (!sbu || row['SBU'] === sbu) &&
             (!machine || row['Machine'] === machine);
    });

    updateTable(filteredData);
  }

  function updateTable(data) {
    const tbody = document.querySelector('#dataTable tbody');
    const noDataMessage = document.getElementById('noDataMessage');
    tbody.innerHTML = '';

    if (data.length === 0) {
      noDataMessage.style.display = 'block';
      return;
    } else {
      noDataMessage.style.display = 'none';
    }

    data.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row['Cluster'] || ''}</td>
        <td>${row['SBU'] || ''}</td>
        <td>${row['Machine'] || ''}</td>
        <td>${row['Design Capacity'] || ''}</td>
        <td>${row['Workable Capacity'] || ''}</td>
        <td>${row['Actual Capacity'] || ''}</td>
        <td>${row['UOM'] || ''}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  fetch(CSV_URL)
    .then(res => res.text())
    .then(text => {
      allData = csvToArray(text);
      populateClusterFilter(allData);
      filteredData = allData;
      updateTable(filteredData);
    })
    .catch(err => {
      document.body.innerHTML = '<p style="color:red; text-align:center;">Failed to load data. Check your Sheet ID and GID and ensure the sheet is published to the web.</p>';
      console.error(err);
    });
</script>

</body>
</html>
